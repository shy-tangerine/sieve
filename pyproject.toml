[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-cli"
version = "13.2.1"
description = "Keyless web research engine for AI agents"
readme = "README.md"
authors = [{name = "Sieve contributors"}]
license = "MIT"
license-files = ["LICENSE", "NOTICE.ddgs.txt", "THIRD-PARTY-NOTICES.md", "licenses/*.txt"]
keywords = ["web research", "web scraping", "search", "crawl", "extract", "mcp", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
# Runtime lower bounds are exercised by compatibility CI before release; upper bounds
# are added when an upstream incompatibility is known rather than guessed pre-emptively.
dependencies = [
    "aiosqlite>=0.20.0", "beautifulsoup4>=4.12", "cssselect>=1.2", "fake-useragent>=2.0",
    "h2>=4.1", "httpcore>=1.0",
    "httpx[http2,socks]>=0.27", "lxml>=6.1.3", "markdownify>=1.2.3",
    "primp>=1.2.3", "pydantic>=2.12", "trafilatura>=2.0.0",
]

[project.optional-dependencies]
browser = [
    "browserforge>=1.2.4", "patchright>=1.50",
    "playwright>=1.50",
]
pdf = ["pdfplumber>=0.11.0", "pypdfium2>=4.30"]
ocr = ["onnxruntime>=1.19", "pypdfium2>=4.30", "rapidocr>=3.0"]
ocr-legacy = ["rapidocr-onnxruntime>=1.3.25; python_version < '3.13'", "onnxruntime>=1.19; python_version < '3.13'"]
rerank = ["onnxruntime>=1.19", "tokenizers>=0.20.3"]
stt = ["faster-whisper>=1.0"]
nlp = ["nltk>=3.8", "tiktoken>=0.5"]
legacy-server = ["mcp>=2,<3", "starlette>=0.40", "uvicorn>=0.30"]
all = [
    "browserforge>=1.2.4", "faster-whisper>=1.0", "onnxruntime>=1.19", "patchright>=1.50",
    "mcp>=2,<3", "starlette>=0.40", "uvicorn>=0.30",
    "pdfplumber>=0.11.0", "playwright>=1.50", "pypdfium2>=4.30",
    "rapidocr>=3.0", "tokenizers>=0.20.3", "nltk>=3.8", "tiktoken>=0.5",
    "yt-dlp>=2025.1.0",
]
dev = ["bandit>=1.8,<2", "pip-audit>=2.9,<3", "pytest-asyncio>=0.24", "pytest-mock>=3.14",
       "pytest>=8.0", "mcp>=2,<3", "starlette>=0.40", "twine>=6,<7",
       "uvicorn>=0.30", "ruff>=0.14,<0.15", "mypy>=1.18,<3", "hypothesis>=6.140,<7"]

[tool.mypy]
files = ["sieve/sdk.py", "sieve/batch_extract.py", "sieve/browser_egress.py", "sieve/pipeline.py", "sieve/integrations.py", "sieve/security.py", "sieve/command_router.py"]
follow_imports = "silent"
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports via lazy __getattr__ (locals() lookup) — F401 is a false positive there
"sieve/__init__.py" = ["F401"]

[tool.setuptools]
packages = ["sieve"]
package-data = {sieve = ["py.typed", "_skills/*/SKILL.md", "data/adblock_domains.txt"]}

[project.scripts]
sieve = "sieve.cli:main"

[project.urls]
Homepage = "https://github.com/shy-tangerine/Sieve"
Repository = "https://github.com/shy-tangerine/Sieve"
Documentation = "https://github.com/shy-tangerine/Sieve/tree/main/docs"
Issues = "https://github.com/shy-tangerine/Sieve/issues"
