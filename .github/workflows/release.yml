name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: sieve-package-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, local-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(uv run --locked --extra dev python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "$expected"
      - run: uv build
      - name: Build local checksums, locked-graph SBOM, and provenance material
        run: |
          uv run --locked --extra dev python scripts/build_attestation_material.py --artifact dist/*.whl --artifact dist/*.tar.gz --source-revision "$GITHUB_SHA" --repository "https://github.com/$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/sieve-build-material.json"
          uv run --locked --extra dev python scripts/build_attestation_material.py --artifact dist/*.whl --artifact dist/*.tar.gz --source-revision "$GITHUB_SHA" --repository "https://github.com/$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/sieve-build-material.json" --verify
      - name: Verify architecture and public import surface
        run: uv run --locked --extra dev python scripts/architecture_report.py --check --output "$RUNNER_TEMP/sieve-architecture.json"
      - name: Validate distribution metadata
        run: uv run --locked --extra dev python scripts/validate_distribution.py
      - run: uv run --locked --extra dev twine check dist/*
      - name: Smoke-test clean wheel install
        run: |
          python -m venv "$RUNNER_TEMP/sieve-release-venv"
          "$RUNNER_TEMP/sieve-release-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sieve-release-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/sieve-release-venv/bin/python" -m pip check
          test "$("$RUNNER_TEMP/sieve-release-venv/bin/sieve" --version)" = "Sieve $("$RUNNER_TEMP/sieve-release-venv/bin/python" -c 'import importlib.metadata as m; print(m.version("sieve-cli"))')"
          "$RUNNER_TEMP/sieve-release-venv/bin/sieve" --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-material
          path: |
            ${{ runner.temp }}/sieve-build-material.json
            ${{ runner.temp }}/sieve-sbom.spdx.json
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error

  attest-distributions:
    if: vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
    needs: build
    runs-on: [self-hosted, Linux, X64, local-ci]
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-material
          path: material
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: 'dist/*'
          create-storage-record: false
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: 'material/*'
          create-storage-record: false

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: [self-hosted, Linux, X64, local-ci]
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sieve-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, Linux, X64, local-ci]
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/sieve-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
